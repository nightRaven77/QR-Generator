name: Build and Release QRGenerator

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build executable on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset_name: QRGenerator-Windows.zip
            artifact_path: dist/QRGenerator.exe
          - os: macos-latest
            asset_name: QRGenerator-macOS.zip
            artifact_path: dist/QRGenerator

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install qrcode pillow customtkinter pyinstaller tomli

      - name: Build executable
        run: |
          python build_exe.py

      - name: Compress asset (Windows)
        if: runner.os == 'Windows'
        run: |
          powershell Compress-Archive -Path dist/QRGenerator.exe -DestinationPath ${{ matrix.asset_name }}

      - name: Compress asset (macOS)
        if: runner.os == 'macOS'
        run: |
          zip -r ${{ matrix.asset_name }} dist/QRGenerator dist/QRGenerator.app

      - name: Upload artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
